name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) — exchange for a short-lived publish token
    steps:
      - uses: actions/checkout@v7
      - uses: nubjs/setup-nub@v0
        with:
          cache: true
      - run: nub ci
      - run: nub run typecheck
      - run: nub run check:all
      # Fail the publish if the committed dist/ is stale — a fresh build must
      # produce no diff. npm publish also runs prepublishOnly (same gate), but
      # surfacing it here gives a clear failure point before the registry call.
      - run: nub run check:dist
      # npm Trusted Publishing (OIDC): nubjs/setup-nub writes a
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` line into .npmrc.
      # With NODE_AUTH_TOKEN unset that expands to an empty token, which makes
      # npm treat auth as configured and skip the OIDC exchange -> ENEEDAUTH.
      # Strip it so npm detects ACTIONS_ID_TOKEN_REQUEST_* and publishes via OIDC.
      - run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then sed -i '/_authToken/d' "$npmrc"; fi
      - run: npm publish
