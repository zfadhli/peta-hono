name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) — exchange for a short-lived publish token
    steps:
      - uses: actions/checkout@v7
      - uses: nubjs/setup-nub@v0
        with:
          cache: true
          # Pin a modern Node so the bundled npm ships OIDC trusted publishing
          # (npm >= 11.5.1 auto-detects ACTIONS_ID_TOKEN_REQUEST_*). nubjs/setup-nub
          # fronts this version on PATH, so bare `npm`/`node` below are this one.
          # Node 22 bundles npm 10.9.x, which is below the OIDC threshold.
          node-version: 26
      - run: nub ci
      - run: nub run typecheck
      - run: nub run check:all
      # Fail the publish if the committed dist/ is stale — a fresh build must
      # produce no diff. npm publish also runs prepublishOnly (same gate), but
      # surfacing it here gives a clear failure point before the registry call.
      - run: nub run check:dist
      # npm Trusted Publishing (OIDC) via the pinned node-version's npm
      # (>=11.5.1). Defensive: a bare/empty `_authToken=` in .npmrc makes npm
      # treat auth as configured and skip the OIDC exchange -> ENEEDAUTH, so
      # strip it. Print versions for the record.
      - name: Inspect npm + strip _authToken (let OIDC kick in)
        run: |
          echo "npm=$(npm --version) node=$(node --version) userconfig=$(npm config get userconfig || true)"
          for f in "$HOME/.npmrc" "${NPM_CONFIG_USERCONFIG:-}"; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            sed -i '/_authToken/d' "$f"
          done
      - name: Publish to npm (OIDC)
        run: npm publish
